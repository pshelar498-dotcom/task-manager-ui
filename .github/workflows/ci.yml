name: CI

# When to run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# What the automatic GITHUB_TOKEN is allowed to do
permissions:
  contents: read     # read the code
  packages: write    # push images to GitHub Container Registry

jobs:
  # ---------- Job 1: install and build ----------
  build:
    name: Install & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

  # ---------- Job 2: build and push the Docker image ----------
  build-and-push:
    name: Build & push Docker image
    needs: build                             # only runs if the build passed
    if: github.event_name == 'push'          # only for pushes to main, not for PRs
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}